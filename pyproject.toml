[project]
name = "thyphon"
version = "0.3.0"
description = "Thyphon event-sourced commodity allocation exchange"
requires-python = ">=3.13"

[project.optional-dependencies]
runtime = ["fastapi==0.141.1", "uvicorn==0.52.0", "psycopg[binary]==3.3.4", "psycopg-pool==3.3.0", "aiokafka==0.14.0"]
dev = ["ruff==0.15.1", "pyright==1.1.408"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"

[project.scripts]
thyphon = "thyphon.tui.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
