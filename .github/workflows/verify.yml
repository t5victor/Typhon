name: verify

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  bazel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: bazelbuild/setup-bazelisk@3ef8fb47c52d50981880b1897fc18d2a1fb05abe # v3.0.0
      - run: bazel test //...
      - run: pip install '.[runtime,dev]'
      - run: ruff check src
      - run: pyright

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          printf '%s\n' \
            'THYPHON_API_KEYS={"ci-supplier":{"actor_id":"supplier","role":"supplier","tenant_id":"ci"},"ci-bidder":{"actor_id":"nova","role":"bidder","tenant_id":"ci"},"ci-operator":{"actor_id":"operator","role":"operator","tenant_id":"ci"},"ci-payment-provider":{"actor_id":"payment-simulator","role":"payment-provider","tenant_id":"ci"}}' \
            'THYPHON_PROVIDER_WEBHOOK_SECRET=ci-only-webhook-secret' \
            'THYPHON_TEST_SUPPLIER_KEY=ci-supplier' \
            'THYPHON_TEST_BIDDER_KEY=ci-bidder' \
            'THYPHON_TEST_OPERATOR_KEY=ci-operator' \
            'THYPHON_TEST_PAYMENT_PROVIDER_KEY=ci-payment-provider' > .env
      - run: docker compose build postgres api
      - run: docker compose up -d --wait postgres
      - run: THYPHON_ALLOW_DESTRUCTIVE_UPGRADE_TEST=1 zsh scripts/verify_legacy_upgrade.zsh
      - run: docker compose run --rm --no-deps api python scripts/verify_postgres_projection.py
      - run: docker compose up -d --wait
      - run: zsh scripts/verify_legacy_delivery.zsh
      - run: docker compose exec -T api python scripts/verify_postgres_concurrency.py
      - run: ./scripts/verify_live.zsh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --remove-orphans
