name: thyphon-live

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
      pull: true
    image: thyphon-postgres:phase-2
    environment:
      POSTGRES_DB: thyphon
      POSTGRES_USER: thyphon
      POSTGRES_PASSWORD: thyphon
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["thyphon-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thyphon -d thyphon"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    build:
      context: .
      dockerfile: Dockerfile.kafka
      pull: true
    image: thyphon-kafka:phase-2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    image: thyphon-api:phase-2
    command: ["uvicorn", "thyphon.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      THYPHON_DATABASE_URL: postgresql://thyphon:thyphon@postgres:5432/thyphon
      THYPHON_KAFKA_BOOTSTRAP: kafka:9092
    ports: ["127.0.0.1:18000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  migrate:
    image: thyphon-api:phase-2
    command: ["python", "-m", "thyphon.infrastructure.migrate"]
    environment:
      THYPHON_DATABASE_URL: postgresql://thyphon:thyphon@postgres:5432/thyphon
    depends_on:
      postgres: { condition: service_healthy }
  outbox-worker:
    image: thyphon-api:phase-2
    command: ["python", "-m", "thyphon.workers.main", "outbox"]
    restart: unless-stopped
    environment:
      THYPHON_DATABASE_URL: postgresql://thyphon:thyphon@postgres:5432/thyphon
      THYPHON_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  projection-worker:
    image: thyphon-api:phase-2
    command: ["python", "-m", "thyphon.workers.main", "projection"]
    restart: unless-stopped
    environment:
      THYPHON_DATABASE_URL: postgresql://thyphon:thyphon@postgres:5432/thyphon
      THYPHON_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  redrive-outbox-worker:
    image: thyphon-api:phase-2
    command: ["python", "-m", "thyphon.workers.main", "redrive-outbox"]
    restart: unless-stopped
    environment:
      THYPHON_DATABASE_URL: postgresql://thyphon:thyphon@postgres:5432/thyphon
      THYPHON_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  thyphon-postgres-data:
